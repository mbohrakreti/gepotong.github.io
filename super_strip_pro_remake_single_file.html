/******************** Icons (inline) ********************/
const Icon = {
  Upload: () => (<svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>),

/******************** Worker logic (stringified) ********************/
const workerLogic = () => {
  function getBrightness(r,g,b){ return 0.299*r + 0.587*g + 0.114*b; }
  function snapToGap(imageData, targetY, snapRange, snapStrength){
    let bestY = targetY; let maxScore = -1;
    const startY = Math.max(0, targetY - snapRange);
    const endY   = Math.min(imageData.height - 1, targetY + snapRange);
    for(let y=startY; y<=endY; y++){
      let rowSum = 0;
      const rowStart = y * imageData.width * 4;
      for(let x=0; x<imageData.width; x++){
        const i = rowStart + x*4;
        rowSum += getBrightness(imageData.data[i], imageData.data[i+1], imageData.data[i+2]);
      }
      const avg = rowSum / imageData.width;
      const dist = 1 - (Math.abs(y - targetY) / Math.max(1, snapRange));
      const score = avg * (1 + snapStrength * dist);
      if(score > maxScore){ maxScore = score; bestY = y; }
    }
    return bestY;
  }
  function postProcessAvoidTinyLast(slices, targetHeight, enabled){
    if(!enabled || slices.length < 2) return slices;
    const last = slices[slices.length-1];
    const h = last.y2 - last.y1;
    if(h < targetHeight*0.6){
      const prev = slices[slices.length-2];
      prev.y2 = last.y2;
      return slices.slice(0, -1);
    }
    return slices;
  }
  self.onmessage = (e) => {
    const { imageData, settings, jobId } = e.data;
    const { width, height } = imageData;
    const targetHeight = Math.round(width * settings.aspectH / settings.aspectW);
    let y = 0; const slices = []; let count=0;
    while(y < height && count < 200){
      let cutY = Math.min(y + targetHeight, height);
      if(settings.smartCut && cutY < height){
        cutY = snapToGap(imageData, cutY, settings.snapRange, settings.snapStrength);
      }
      slices.push({ y1: y, y2: cutY });
      if(cutY >= height) break;
      y = Math.max(0, cutY - settings.overlapPx);
      count++;
    }
    const finalSlices = postProcessAvoidTinyLast(slices, targetHeight, settings.avoidTinyLast);
    self.postMessage({ jobId, slices: finalSlices });
  };
};

/******************** App ********************/
const App = () => {
  const [theme, setTheme] = React.useState('dark');
  const [lang, setLang] = React.useState('id');
  const t = uiText[lang];

  const [jobs, setJobs] = React.useState([]); // each: {id,name,width,height,imgUrl,imgElement,slices,lockManual}
  const [activeJobId, setActiveJobId] = React.useState(null);

  const [settings, setSettings] = React.useState({
    aspectW: 4, aspectH: 3, smartCut: true, snapRange: 96, snapStrength: 0.7,
    overlapPx: 32, marginTop: 16, marginBottom: 16, avoidTinyLast: true,
    format: 'jpeg', quality: 0.92, folderName: '', filenameTemplate: '{basename}_p{index}.{ext}'
  });

  const [processing, setProcessing] = React.useState({ busy:false, msg:'', prog:0 });

  const workerRef = React.useRef(null);
  const fileInputRef = React.useRef(null);
  const baseCanvasRef = React.useRef(null);
  const overlayCanvasRef = React.useRef(null);
  const activeHandleRef = React.useRef(null);
  const [mousePos, setMousePos] = React.useState(null);
  const [editorZoom, setEditorZoom] = React.useState(100);
  const [sourceFolderName, setSourceFolderName] = React.useState('');

  /********** Theme **********/
  React.useEffect(() => {
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(prefersDark ? 'dark':'light');
  }, []);
  React.useEffect(() => {
    document.documentElement.classList.toggle('dark', theme === 'dark');
  }, [theme]);

  /********** Worker init **********/
  React.useEffect(() => {
    const code = `(${workerLogic.toString()})()`;
    const blob = new Blob([code], { type:'application/javascript' });
    const url = URL.createObjectURL(blob);
    const worker = new Worker(url);
    workerRef.current = worker;
    worker.onmessage = (e) => {
      const { jobId, slices } = e.data;
      setJobs(prev => prev.map(j => j.id === jobId ? { ...j, slices } : j));
      setProcessing({ busy:false, msg:'', prog:0 });
    };
    return () => { worker.terminate(); URL.revokeObjectURL(url); };
  }, []);

  /********** Canvas redraw **********/
  React.useEffect(() => { const id=setTimeout(drawBaseCanvas, 30); return () => clearTimeout(id); }, [jobs, activeJobId, editorZoom, settings]);
  React.useEffect(() => { drawOverlayCanvas(); }, [mousePos]);
  React.useEffect(() => { drawOverlayCanvas(); }, [jobs, activeJobId, settings]);

  /********** File handling **********/
  const onDrop = (e) => {
    e.preventDefault(); setSourceFolderName('');
    const files = Array.from(e.dataTransfer.files).filter(f => /image\/(png|jpe?g|webp)/i.test(f.type));
    addFiles(files);
  };
  const onFilePick = (e) => {
    const files = Array.from(e.target.files || []);
    if(files.length && files[0].webkitRelativePath){
      const folder = files[0].webkitRelativePath.split('/')[0]; setSourceFolderName(folder);
    } else setSourceFolderName('');
    addFiles(files); e.target.value = null;
  };
  const triggerPickFiles = () => { if(fileInputRef.current){ fileInputRef.current.removeAttribute('webkitdirectory'); fileInputRef.current.removeAttribute('directory'); fileInputRef.current.setAttribute('multiple','true'); fileInputRef.current.click(); } };
  const triggerPickFolder = () => { if(fileInputRef.current){ fileInputRef.current.setAttribute('webkitdirectory','true'); fileInputRef.current.setAttribute('directory','true'); fileInputRef.current.click(); } };

  const addFiles = (files) => {
    const proms = files.map(file => new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          resolve({ id: crypto.randomUUID(), file, name: file.name, width: img.width, height: img.height, imgUrl: ev.target.result, imgElement: img, slices: [], lockManual: false });
        };
        img.onerror = reject; img.src = ev.target.result;
      };
      fr.onerror = reject; fr.readAsDataURL(file);
    }));
    Promise.all(proms).then(newJobs => {
      setJobs(prev => {
        const combined = [...prev, ...newJobs];
        combined.sort((a,b) => a.name.localeCompare(b.name, undefined, {numeric:true,sensitivity:'base'}));
        if(!activeJobId && combined.length) setActiveJobId(combined[0].id);
        return combined;
      });
    });
  };

  /********** Slicing **********/
  const runSlicingForJob = (jobId) => {
    const job = jobs.find(j => j.id === jobId);
    if(!job) return;
    if(job.lockManual) return; // jangan overwrite yang terkunci
    setProcessing({ busy:true, msg: `${t.processing} ${job.name}`, prog: 0 });
    const cvs = document.createElement('canvas'); cvs.width = job.width; cvs.height = job.height;
    const ctx = cvs.getContext('2d'); ctx.drawImage(job.imgElement, 0, 0);
    const imageData = ctx.getImageData(0, 0, job.width, job.height);
    workerRef.current.postMessage({ jobId: job.id, imageData, settings });
  };
  const runSlicingForAll = () => { jobs.forEach(j => { if(!j.lockManual) runSlicingForJob(j.id); }); };

  /********** Presets **********/
  const applyPreset = (name) => {
    if(name === 'comic'){
      setSettings(s => ({...s, aspectW:4, aspectH:3, smartCut:true, snapRange:128, snapStrength:0.8, overlapPx:48, marginTop:0, marginBottom:0 }));
    } else if(name === 'webtoon'){
      setSettings(s => ({...s, aspectW:9, aspectH:16, smartCut:true, snapRange:150, snapStrength:0.7, overlapPx:32, marginTop:0, marginBottom:0 }));
    }
    // opsional: re-slice hanya job aktif jika tidak terkunci
    const job = jobs.find(j => j.id === activeJobId);
    if(job && !job.lockManual) runSlicingForJob(job.id);
  };

  /********** Manual edit helpers **********/
  const addSlice = (cutY_img) => {
    const job = jobs.find(j => j.id === activeJobId);
    if(!job || cutY_img <= 0 || cutY_img >= job.height) return;
    // jika belum ada slice sama sekali: buat dua bagian
    if(job.slices.length === 0){
      const ns = [{y1:0, y2:cutY_img}, {y1:cutY_img, y2:job.height}];
      setJobs(prev => prev.map(j => j.id === activeJobId ? { ...j, slices: ns, lockManual: true } : j));
      return;
    }
    // cari slice yang akan di-split
    let idx = -1;
    for(let i=0;i<job.slices.length;i++){
      if(cutY_img > job.slices[i].y1 && cutY_img < job.slices[i].y2){ idx = i; break; }
    }
    if(idx === -1) return;
    setJobs(prev => prev.map(j => {
      if(j.id !== activeJobId) return j;
      const old = j.slices; const s = old[idx];
      const minGap = 50; // minimal tinggi sisi
      if(cutY_img - s.y1 < minGap || s.y2 - cutY_img < minGap) return j;
      const ns = [...old];
      ns.splice(idx, 1, {y1:s.y1, y2:cutY_img}, {y1:cutY_img, y2:s.y2});
      return { ...j, slices: ns, lockManual: true };
    }));
  };
  const deleteSlice = (handleIndex) => {
    setJobs(prev => prev.map(j => {
      if(j.id !== activeJobId) return j;
      if(j.slices.length <= 1) return j;
      const ns = [...j.slices];
      const a = ns[handleIndex];
      const b = ns[handleIndex+1];
      a.y2 = b.y2; ns.splice(handleIndex+1, 1);
      return { ...j, slices: ns, lockManual: true };
    }));
  };

  /********** Canvas drawing **********/
  const drawBaseCanvas = () => {
    const base = baseCanvasRef.current; const overlay = overlayCanvasRef.current;
    if(!base || !overlay) return;
    const job = jobs.find(j => j.id === activeJobId);
    const container = base.parentElement; if(!container){ return; }

    if(!job || !job.imgElement){ base.width=base.height=overlay.width=overlay.height=1; return; }

    const dpr = window.devicePixelRatio || 1;
    const cssW = container.getBoundingClientRect().width; // wrapper width
    const scale = cssW / job.width; const cssH = job.height * scale;

    [base, overlay].forEach(c => { c.style.width = cssW+"px"; c.style.height = cssH+"px"; c.width = Math.max(1, Math.floor(cssW*dpr)); c.height = Math.max(1, Math.floor(cssH*dpr)); });

    const ctx = base.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0); // retina
    ctx.clearRect(0,0,cssW,cssH);
    ctx.drawImage(job.imgElement, 0, 0, cssW, cssH);

    // draw cut lines & handles (except last)
    const handleH = 20;
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(239,68,68,0.9)';
    job.slices.forEach((sl, i) => {
      if(i < job.slices.length - 1){
        const y = sl.y2 * scale;
        ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(cssW,y); ctx.stroke();
        // handle
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(cssW/2 - 25, y - handleH/2, 50, handleH);
        // label
        ctx.fillStyle = 'white'; ctx.font = 'bold 12px ui-sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        const globalIndex = computeGlobalIndex(i);
        ctx.fillText(globalIndex, cssW/2, y);
      }
    });
    ctx.setTransform(1,0,0,1,0,0);
  };

  const drawOverlayCanvas = () => {
    const canvas = overlayCanvasRef.current; if(!canvas) return;
    const base = baseCanvasRef.current; const job = jobs.find(j => j.id === activeJobId);
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width, canvas.height);
    if(!mousePos || !job) return;

    const dpr = window.devicePixelRatio || 1; ctx.setTransform(dpr,0,0,dpr,0,0);
    const cssW = canvas.width / dpr; const scale = cssW / job.width; const handleH = 20;

    const my = mousePos.y; // canvas CSS coords
    // is hovering a handle?
    let overHandle = false, handleIndex = -1;
    for(let i=0; i<job.slices.length - 1; i++){
      const hy = job.slices[i].y2 * scale;
      if(Math.abs(my - hy) < handleH/2){ overHandle = true; handleIndex = i; break; }
    }

    if(overHandle){
      const hy = job.slices[handleIndex].y2 * scale;
      // draw trash button on right
      ctx.fillStyle = 'rgba(239,68,68,0.9)';
      const bx = cssW - 45, by = hy - 15, bw = 30, bh = 30;
      roundRect(ctx, bx, by, bw, bh, 6); ctx.fill();
      // draw trash icon
      ctx.save(); ctx.translate(bx + bw/2, by + bh/2); ctx.scale(0.8,0.8);
      ctx.strokeStyle = 'white'; ctx.lineWidth = 2;
      pathTrash(ctx); ctx.restore();
    } else {
      // hover free line
      ctx.fillStyle = 'rgba(37,99,235,0.9)';
      ctx.fillRect(0, my-1, cssW, 2);
      // plus handle
      const bx = cssW/2 - 25, by = my - 10, bw = 50, bh = 20;
      roundRect(ctx, bx, by, bw, bh, 6); ctx.fill();
      ctx.save(); ctx.translate(cssW/2, my); ctx.scale(0.7,0.7); ctx.strokeStyle='white'; ctx.lineWidth=3; pathPlus(ctx); ctx.restore();
    }
    ctx.setTransform(1,0,0,1,0,0);
  };

  function roundRect(ctx,x,y,w,h,r){ const rr=Math.min(r, w/2, h/2); ctx.beginPath(); ctx.moveTo(x+rr,y); ctx.arcTo(x+w,y,x+w,y+h,rr); ctx.arcTo(x+w,y+h,x,y+h,rr); ctx.arcTo(x,y+h,x,y,rr); ctx.arcTo(x,y,x+w,y,rr); ctx.closePath(); }
  function pathPlus(ctx){ ctx.beginPath(); ctx.moveTo(0,-8); ctx.lineTo(0,8); ctx.moveTo(-8,0); ctx.lineTo(8,0); ctx.stroke(); }
  function pathTrash(ctx){ ctx.beginPath(); ctx.moveTo(-10,-6); ctx.lineTo(10,-6); ctx.moveTo(8,-6); ctx.lineTo(8,10); ctx.lineTo(-8,10); ctx.lineTo(-8,-6); ctx.moveTo(-2,-2); ctx.lineTo(-2,6); ctx.moveTo(2,-2); ctx.lineTo(2,6); ctx.stroke(); }

  function computeGlobalIndex(localIndex){
    // local index within active image only; we display local order for clarity
    return localIndex + 1;
  }

  /********** Mouse handlers **********/
  const onCanvasDown = (e) => {
    const canvas = overlayCanvasRef.current; const base = baseCanvasRef.current; if(!canvas || !base) return;
    const rect = canvas.getBoundingClientRect();
    const job = jobs.find(j => j.id === activeJobId); if(!job) return;
    const scale = rect.width / job.width; const mx = e.clientX - rect.left; const my = e.clientY - rect.top;
    const myImg = my / scale; const handleH = 20;

    // detect handle
    let overHandle = false, handleIndex = -1;
    for(let i=0; i<job.slices.length - 1; i++){
      const hy = job.slices[i].y2 * scale;
      if(Math.abs(my - hy) < handleH){ overHandle = true; handleIndex = i; break; }
    }

    if(overHandle){
      // If click on trash area (right side box), delete; else start drag
      if(mx > rect.width - 45 && mx < rect.width - 15){ deleteSlice(handleIndex); }
      else { activeHandleRef.current = handleIndex; canvas.style.cursor = 'row-resize'; }
    } else {
      addSlice(myImg);
    }
  };
  const onCanvasMove = (e) => {
    const canvas = overlayCanvasRef.current; if(!canvas) return;
    const rect = canvas.getBoundingClientRect();
    setMousePos({ x: e.clientX - rect.left, y: e.clientY - rect.top });
    if(activeHandleRef.current === null || activeHandleRef.current === undefined) return;
    const job = jobs.find(j => j.id === activeJobId); if(!job) return;
    const scale = rect.width / job.width; const myImg = (e.clientY - rect.top) / scale; const idx = activeHandleRef.current;
    setJobs(prev => prev.map(j => {
      if(j.id !== activeJobId) return j;
      const ns = [...j.slices]; const cur = ns[idx]; const nxt = ns[idx+1];
      const minY = (idx>0 ? ns[idx-1].y2 : 0) + 50;
      const maxY = (nxt ? nxt.y2 : j.height) - 50;
      const ny = Math.max(minY, Math.min(myImg, maxY));
      cur.y2 = ny; if(nxt) nxt.y1 = ny;
      return { ...j, slices: ns, lockManual: true };
    }));
  };
  const onCanvasUp = () => { activeHandleRef.current = null; if(overlayCanvasRef.current) overlayCanvasRef.current.style.cursor = 'crosshair'; };
  const onCanvasLeave = () => { setMousePos(null); onCanvasUp(); };

  /********** Export **********/
  const handleExport = async () => {
    if(typeof JSZip === 'undefined'){ alert('ZIP lib missing'); return; }
    // hitung total slices dan pad length dinamis
    const totalSlices = jobs.reduce((acc, j) => acc + j.slices.length, 0);
    const padLen = Math.max(2, String(totalSlices).length);

    setProcessing({ busy:true, msg:'Preparing ZIP…', prog:0 });
    try{
      const zip = new JSZip(); let globalIndex = 0; const total = totalSlices || 1;
      for(const job of jobs){
        for(let i=0;i<job.slices.length;i++){
          const sl = job.slices[i]; if(sl.y2 <= sl.y1) continue;
          const sliceCanvas = document.createElement('canvas');
          const slW = job.width; const slH = sl.y2 - sl.y1;
          const extraTop = settings.marginTop|0; const extraBot = settings.marginBottom|0;
          sliceCanvas.width = slW; sliceCanvas.height = slH + extraTop + extraBot;
          const sctx = sliceCanvas.getContext('2d');
          // background fill for JPEG (no transparency)
          if(settings.format === 'jpeg'){
            sctx.fillStyle = '#ffffff'; sctx.fillRect(0,0,sliceCanvas.width, sliceCanvas.height);
          } else { sctx.clearRect(0,0,sliceCanvas.width, sliceCanvas.height); }
          sctx.drawImage(job.imgElement, 0, sl.y1, slW, slH, 0, extraTop, slW, slH);
          const blob = await new Promise(res => sliceCanvas.toBlob(res, `image/${settings.format}`, settings.quality));

          const basename = job.name.replace(/\.[^.]+$/,'');
          const ext = settings.format === 'jpeg' ? 'jpg' : settings.format;
          globalIndex += 1; const indexStr = String(globalIndex).padStart(padLen, '0');
          const fname = settings.filenameTemplate
            .replace('{basename}', basename)
            .replace('{index}', indexStr)
            .replace('{ext}', ext);
          const path = settings.folderName.trim() ? `${settings.folderName.trim()}/${fname}` : fname;
          zip.file(path, blob);
          setProcessing(p => ({ ...p, prog: Math.round((globalIndex/total)*100) }));
        }
      }
      const out = await zip.generateAsync({ type:'blob' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(out); a.download = 'SuperStrip_Export.zip'; a.click(); URL.revokeObjectURL(a.href);
    } catch(err){ console.error(err); }
    finally { setProcessing({ busy:false, msg:'', prog:0 }); }
  };

  /********** Remove job (safe active selection) **********/
  const removeJob = (jobId) => {
    setJobs(prev => {
      const idx = prev.findIndex(j => j.id === jobId);
      const next = prev.filter(j => j.id !== jobId);
      // choose next active id gracefully
      if(activeJobId === jobId){
        const nextActive = next[idx] ? next[idx].id : (next[idx-1] ? next[idx-1].id : (next[0]?.id || null));
        setActiveJobId(nextActive || null);
      }
      return next;
    });
  };

  /********** UI helpers **********/
  const activeJob = jobs.find(j => j.id === activeJobId);
  const queueTitle = sourceFolderName
    ? `${t.fileQueue}: ${sourceFolderName}`
    : activeJob ? `${t.fileQueue}: ${activeJob.name}` : `${t.fileQueue} (${jobs.length})`;

  const zoomIn = () => setEditorZoom(z => Math.min(300, z+10));
  const zoomOut = () => setEditorZoom(z => Math.max(10, z-10));
  const zoomReset = () => setEditorZoom(100);

  return (
    <div className={`min-h-screen text-gray-800 dark:text-gray-200 ${theme==='dark'?'dark':''}`}>
      <input type="file" className="hidden" ref={fileInputRef} onChange={onFilePick} multiple accept="image/png, image/jpeg, image/webp" />
      {/* Header */}
      <header className="p-4 flex justify-between items-center border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800">
        <div>
          <h1 className="text-xl font-bold text-blue-600 dark:text-blue-400">{t.appName}</h1>
          <p className="text-xs text-gray-500 dark:text-gray-400">{t.tagline}</p>
        </div>
        <div className="flex items-center gap-2">
          <select value={lang} onChange={e=>setLang(e.target.value)} className="bg-gray-200 dark:bg-gray-700 rounded p-1 text-sm">
            <option value="id">ID</option>
            <option value="en">EN</option>
          </select>
          <button onClick={()=>setTheme(theme==='dark'?'light':'dark')} className="p-2 rounded hover:bg-gray-200 dark:hover:bg-gray-700">
            {theme==='dark' ? <Icon.Sun/> : <Icon.Moon/>}
          </button>
        </div>
      </header>

      {/* Main */}
      <main className="flex flex-col lg:flex-row p-4 gap-4" style={{height:'calc(100vh - 72px)'}}>
        {/* Left pane */}
        <div className="flex-1 flex flex-col gap-4 overflow-hidden">
          {jobs.length === 0 ? (
            <div className="flex-1 border-4 border-dashed border-gray-300 dark:border-gray-600 rounded-lg flex flex-col items-center justify-center text-center p-8 hover:border-blue-500 dark:hover:border-blue-400"
                 onDragOver={e=>e.preventDefault()} onDrop={onDrop}>
              <Icon.Upload/>
              <p className="mt-3">{t.dropzone}</p>
              <div className="mt-4 flex gap-3">
                <button onClick={triggerPickFiles} className="bg-blue-600 text-white font-semibold py-2 px-4 rounded hover:bg-blue-700">{t.addImage}</button>
                <button onClick={triggerPickFolder} className="bg-gray-600 text-white font-semibold py-2 px-4 rounded hover:bg-gray-700">{t.addFolder}</button>
              </div>
            </div>
          ) : (
            <div className="flex flex-col h-full">
              {/* Queue header */}
              <div className="flex-shrink-0 bg-white dark:bg-gray-800 p-2 rounded-t-lg border-b dark:border-gray-700 flex justify-between items-center">
                <h2 className="font-bold text-sm truncate pr-4">{queueTitle}</h2>
                <div className="flex gap-2">
                  <button onClick={triggerPickFiles} className="px-3 py-1 rounded bg-gray-200 dark:bg-gray-700 text-sm">{t.addImage}</button>
                  <button onClick={triggerPickFolder} className="px-3 py-1 rounded bg-gray-200 dark:bg-gray-700 text-sm">{t.addFolder}</button>
                </div>
              </div>
              {/* Queue thumbnails */}
              <div className="flex-shrink-0 overflow-x-auto p-2 bg-white dark:bg-gray-800">
                <div className="flex gap-2">
                  {jobs.map((job, idx) => (
                    <div key={job.id} onClick={()=>setActiveJobId(job.id)} className={`relative p-1 border-2 rounded-lg cursor-pointer flex-shrink-0 ${activeJobId===job.id?'border-blue-500':'border-transparent'}`}>
                      <span className="absolute top-0 left-0 bg-black/70 text-white text-xs font-bold px-1.5 py-0.5 rounded-br-lg rounded-tl-md">{idx+1}</span>
                      {job.lockManual && <span className="absolute top-0 right-0 bg-amber-500 text-white text-[10px] font-bold px-1 py-0.5 rounded-bl">LOCK</span>}
                      <img src={job.imgUrl} alt={job.name} className="h-20 w-auto object-contain rounded bg-gray-200 dark:bg-gray-700"/>
                      <p className="text-xs truncate w-24 mt-1">{job.name}</p>
                      <button onClick={(e)=>{e.stopPropagation(); removeJob(job.id);}} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center"><Icon.Close/></button>
                    </div>
                  ))}
                </div>
              </div>
              {/* Editor */}
              <div className="flex-1 overflow-auto mt-2 p-4 bg-gray-200 dark:bg-gray-950 rounded-b-lg relative no-browser-zoom">
                {activeJob && (
                  <div className="relative mx-auto" style={{width: `${editorZoom}%`, transition:'width .1s ease-out'}}>
                    <canvas ref={baseCanvasRef} className="block shadow-lg" />
                    <canvas ref={overlayCanvasRef} className="absolute top-0 left-0" style={{cursor:'crosshair'}}
                            onMouseDown={onCanvasDown} onMouseMove={onCanvasMove} onMouseUp={onCanvasUp} onMouseLeave={onCanvasLeave} />
                    {/* Lock toggle */}
                    <div className="absolute top-3 right-3 bg-white/80 dark:bg-gray-800/80 backdrop-blur px-2 py-1 rounded shadow text-xs flex items-center gap-2">
                      <input type="checkbox" checked={!!activeJob.lockManual} onChange={(e)=>{
                        const checked = e.target.checked;
                        setJobs(prev => prev.map(j => j.id===activeJobId ? { ...j, lockManual: checked } : j));
                      }}/>
                      <span>{t.lockManual}</span>
                    </div>
                  </div>
                )}
                {activeJob && (
                  <div className="absolute bottom-4 right-4 bg-gray-800/70 text-white p-1 rounded-full flex items-center space-x-1 backdrop-blur-sm z-10">
                    <button onClick={zoomOut} className="p-2 rounded-full hover:bg-white/20">-</button>
                    <span className="font-mono text-xs w-12 text-center cursor-pointer" onClick={zoomReset}>{editorZoom}%</span>
                    <button onClick={zoomIn} className="p-2 rounded-full hover:bg-white/20">+</button>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>

        {/* Right pane (Settings) */}
        <div className="w-full lg:w-80 xl:w-96 flex-shrink-0 bg-white dark:bg-gray-800 rounded-lg p-4 flex flex-col overflow-y-auto">
          <div className="flex items-center gap-2 mb-4"><Icon.Settings/><h2 className="text-lg font-bold">{t.settings}</h2></div>

          {/* Actions */}
          <div className="mb-4 pb-4 border-b border-gray-200 dark:border-gray-700 space-y-2">
            <button onClick={runSlicingForAll} disabled={processing.busy || jobs.length===0} className="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed">{t.sliceAll}</button>
            <button onClick={handleExport} disabled={processing.busy || jobs.length===0} className="w-full bg-green-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-green-700 disabled:bg-gray-400 disabled:cursor-not-allowed">{t.exportAll}</button>
          </div>

          {/* Presets */}
          <div className="p-3 bg-gray-100 dark:bg-gray-700 rounded-md mb-4">
            <label className="text-sm font-semibold block mb-2">{t.applyPreset}</label>
            <select defaultValue="" onChange={(e)=>applyPreset(e.target.value)} className="w-full p-2 rounded bg-white dark:bg-gray-600 border border-gray-300 dark:border-gray-500">
              <option value="" disabled>{t.selectPreset}</option>
              <option value="comic">{t.presetComic}</option>
              <option value="webtoon">{t.presetWebtoon}</option>
            </select>
          </div>

          {/* Smart Cut */}
          <div className="p-3 bg-gray-100 dark:bg-gray-700 rounded-md mb-4 space-y-2">
            <label className="flex items-center justify-between cursor-pointer">
              <span className="font-semibold">{t.smartCut}</span>
              <input type="checkbox" checked={settings.smartCut} onChange={e=>setSettings(s=>({...s, smartCut:e.target.checked}))} />
            </label>
            {settings.smartCut && (
              <>
                <label className="text-sm">{t.snapRange}: {settings.snapRange}</label>
                <input type="range" min="16" max="256" step="8" value={settings.snapRange} onChange={e=>setSettings(s=>({...s, snapRange:Number(e.target.value)}))} className="w-full" />
                <label className="text-sm">{t.snapStrength}: {settings.snapStrength.toFixed(1)}</label>
                <input type="range" min="0.1" max="1" step="0.1" value={settings.snapStrength} onChange={e=>setSettings(s=>({...s, snapStrength:Number(e.target.value)}))} className="w-full" />
              </>
            )}
          </div>

          {/* Ratio & margins */}
          <div className="p-3 bg-gray-100 dark:bg-gray-700 rounded-md mb-4 space-y-2">
            <label className="text-sm font-semibold">{t.aspectRatio}</label>
            <select value={`${settings.aspectW}:${settings.aspectH}`} onChange={e=>{ const [w,h]=e.target.value.split(':').map(Number); setSettings(s=>({...s, aspectW:w, aspectH:h})); }} className="w-full p-2 rounded bg-white dark:bg-gray-600 border border-gray-300 dark:border-gray-500">
              <option value="4:3">{t.aspect_4_3}</option>
              <option value="1:1">{t.aspect_1_1}</option>
              <option value="9:16">{t.aspect_9_16}</option>
            </select>
            <label className="text-sm font-semibold block">{t.overlap}: {settings.overlapPx}</label>
            <input type="range" min="0" max="128" step="4" value={settings.overlapPx} onChange={e=>setSettings(s=>({...s, overlapPx:Number(e.target.value)}))} className="w-full" />
            <label className="text-sm font-semibold block">{t.marginTop}: {settings.marginTop}</label>
            <input type="range" min="0" max="64" step="2" value={settings.marginTop} onChange={e=>setSettings(s=>({...s, marginTop:Number(e.target.value)}))} className="w-full" />
            <label className="text-sm font-semibold block">{t.marginBottom}: {settings.marginBottom}</label>
            <input type="range" min="0" max="64" step="2" value={settings.marginBottom} onChange={e=>setSettings(s=>({...s, marginBottom:Number(e.target.value)}))} className="w-full" />
            <label className="flex items-center justify-between cursor-pointer text-sm">
              <span className="font-semibold">{t.avoidTinyLast}</span>
              <input type="checkbox" checked={settings.avoidTinyLast} onChange={e=>setSettings(s=>({...s, avoidTinyLast:e.target.checked}))} />
            </label>
          </div>

          {/* Output */}
          <div className="p-3 bg-gray-100 dark:bg-gray-700 rounded-md space-y-2">
            <label className="text-sm font-semibold">{t.outputFormat}</label>
            <select value={settings.format} onChange={e=>setSettings(s=>({...s, format:e.target.value}))} className="w-full p-2 rounded bg-white dark:bg-gray-600 border border-gray-300 dark:border-gray-500">
              <option value="jpeg">JPEG</option>
              <option value="png">PNG</option>
              <option value="webp">WebP</option>
            </select>
            {settings.format !== 'png' && (
              <>
                <label className="text-sm font-semibold block">{t.quality}: {settings.quality.toFixed(2)}</label>
                <input type="range" min="0.1" max="1" step="0.01" value={settings.quality} onChange={e=>setSettings(s=>({...s, quality:Number(e.target.value)}))} className="w-full" />
              </>
            )}
            <label className="text-sm font-semibold block">{t.folderName}</label>
            <input type="text" value={settings.folderName} onChange={e=>setSettings(s=>({...s, folderName:e.target.value}))} placeholder="Chapter10 (optional)" className="w-full p-2 rounded bg-white dark:bg-gray-600 border border-gray-300 dark:border-gray-500"/>
          </div>

          {/* Help box */}
          <div className="p-3 mt-4 bg-blue-50 dark:bg-blue-900/30 rounded text-xs text-blue-800 dark:text-blue-200">
            {t.helpIntro}
          </div>
        </div>
      </main>

      {/* Processing bar */}
      {processing.busy && (
        <div className="fixed bottom-0 left-0 right-0 bg-gray-800 text-white p-2 text-sm z-50">
          <div className="flex justify-between items-center"><span>{processing.msg}</span><span>{processing.prog}%</span></div>
          <div className="w-full bg-gray-600 rounded-full h-1.5 mt-1"><div className="bg-blue-500 h-1.5 rounded-full" style={{width: processing.prog+'%'}}/></div>
        </div>
      )}

    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
